<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador HTML CSS JS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        header {
            padding: 15px;
            background: #222;
            color: white;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 22px;
        }

        .selecao {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .selecao label {
            cursor: pointer;
        }

        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 15px;
        }

        .editor,
        .preview {
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
        }

        .editor h2,
        .preview h2 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        textarea {
            width: 100%;
            height: 180px;
            resize: vertical;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #bbb;
            border-radius: 4px;
        }

        .preview {
            min-height: 570px;
        }

        iframe {
            width: 100%;
            height: 520px;
            border: 1px solid #bbb;
            background: white;
        }

        footer {
            text-align: center;
            padding: 10px;
            color: #666;
        }

        #status {
            margin-top: 8px;
            font-size: 13px;
            color: #555;
        }

        @media (max-width: 800px) {
            main {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1>Visualizador HTML, CSS e JS</h1>

        <div class="selecao">

            <label>
                <input type="checkbox" id="usarHTML" checked>
                HTML
            </label>

            <label>
                <input type="checkbox" id="usarCSS" checked>
                CSS
            </label>

            <label>
                <input type="checkbox" id="usarJS" checked>
                JavaScript
            </label>

        </div>

        <div id="status">
            Modo: HTML + CSS + JavaScript
        </div>

    </header>

    <main>

        <section class="editor">

            <h2>HTML</h2>

            <textarea id="htmlCode" spellcheck="false"><h1>Olá!</h1>
<p>Este é um teste.</p>
<button onclick="teste()">Clique aqui</button></textarea>

        </section>

        <section class="editor">

            <h2>CSS</h2>

            <textarea id="cssCode" spellcheck="false">body {
    font-family: Arial;
    text-align: center;
    padding: 30px;
}

h1 {
    color: royalblue;
}

button {
    padding: 10px 20px;
    cursor: pointer;
}</textarea>

        </section>

        <section class="editor">

            <h2>JavaScript</h2>

            <textarea id="jsCode" spellcheck="false">function teste() {
    alert("JavaScript funcionando!");
}</textarea>

        </section>

        <section class="preview">

            <h2>Prévia</h2>

            <iframe id="preview"></iframe>

        </section>

    </main>

    <footer>
        Visualizador simples de HTML, CSS e JavaScript
    </footer>

    <script>
        const htmlCode = document.getElementById("htmlCode");
        const cssCode = document.getElementById("cssCode");
        const jsCode = document.getElementById("jsCode");

        const usarHTML = document.getElementById("usarHTML");
        const usarCSS = document.getElementById("usarCSS");
        const usarJS = document.getElementById("usarJS");

        const preview = document.getElementById("preview");
        const status = document.getElementById("status");

        function atualizar() {

            const html = htmlCode.value;
            const css = cssCode.value;
            const js = jsCode.value;

            const todosSelecionados =
                usarHTML.checked &&
                usarCSS.checked &&
                usarJS.checked;

            /*
                IMPORTANTE:

                Mesmo que nem todos os três estejam selecionados,
                nenhum código é descartado.

                Nesse caso, o conteúdo é tratado como código
                embutido na mesma página de visualização.
            */

            if (todosSelecionados) {
                status.textContent = "Modo: HTML + CSS + JavaScript";
            } else {
                status.textContent = "Modo: código embutido — nenhum código foi descartado";
            }

            const documento = `
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <style>
        ${css}
    </style>
</head>

<body>

    ${html}

    <script>
        ${js}
    <\/script>

</body>
</html>
`;

            preview.srcdoc = documento;
        }

        htmlCode.addEventListener("input", atualizar);
        cssCode.addEventListener("input", atualizar);
        jsCode.addEventListener("input", atualizar);

        usarHTML.addEventListener("change", atualizar);
        usarCSS.addEventListener("change", atualizar);
        usarJS.addEventListener("change", atualizar);

        atualizar();
    </script>

</body>

</html>
