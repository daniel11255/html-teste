
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador HTML</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eee;
        }

        #editor {
            width: 80%;
            max-width: 1000px;
            margin: 30px auto;
        }

        h1 {
            text-align: center;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 15px;
            font-family: monospace;
            font-size: 15px;
            resize: vertical;
            border: 1px solid #aaa;
        }

        #css,
        #js {
            height: 180px;
        }

        button {
            padding: 10px 20px;
            margin-right: 5px;
            cursor: pointer;
            border: 1px solid #999;
            background: white;
        }

        button:hover {
            background: #ddd;
        }

        .opcionais {
            margin-bottom: 15px;
        }

        .opcional {
            display: none;
        }

        #preview {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
</head>

<body>

    <div id="editor">

        <h1>Visualizador HTML</h1>

        <!-- HTML -->
        <div class="campo">
            <label for="html">HTML</label>

            <textarea id="html" placeholder="Cole seu HTML aqui..."></textarea>
        </div>


        <!-- Botões para adicionar CSS e JS -->
        <div class="opcionais">

            <button onclick="mostrarCSS()">
                + Adicionar CSS
            </button>

            <button onclick="mostrarJS()">
                + Adicionar JavaScript
            </button>

        </div>


        <!-- CSS -->
        <div id="campoCSS" class="campo opcional">

            <label for="css">CSS</label>

            <textarea id="css" placeholder="Cole seu CSS aqui..."></textarea>

        </div>


        <!-- JavaScript -->
        <div id="campoJS" class="campo opcional">

            <label for="js">JavaScript</label>

            <textarea id="js" placeholder="Cole seu JavaScript aqui..."></textarea>

        </div>


        <button onclick="visualizar()">
            Visualizar
        </button>

    </div>


    <!-- Área onde o resultado será exibido -->
    <iframe id="preview"></iframe>


    <script>

        function mostrarCSS() {

            const campo = document.getElementById("campoCSS");

            campo.style.display = "block";

        }


        function mostrarJS() {

            const campo = document.getElementById("campoJS");

            campo.style.display = "block";

        }


        function visualizar() {

            const html = document.getElementById("html").value;
            const css = document.getElementById("css").value;
            const js = document.getElementById("js").value;

            const codigoFinal = `
                ${html}

                <style>
                    ${css}
                </style>

                <script>
                    ${js}
                <\/script>
            `;

            const preview = document.getElementById("preview");

            preview.srcdoc = codigoFinal;

            document.getElementById("editor").style.display = "none";

            preview.style.display = "block";
        }

    </script>

</body>

</html>
