<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Visualizador Simples de HTML/CSS/JS</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 16px;
      background: #f5f5f5;
    }
    h1 {
      font-size: 1.2rem;
      margin-bottom: 8px;
    }
    label {
      display: inline-block;
      margin-right: 12px;
      font-size: 0.9rem;
    }
    textarea {
      width: 100%;
      height: 180px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem;
      padding: 8px;
      box-sizing: border-box;
      resize: vertical;
    }
    button {
      margin-top: 8px;
      padding: 6px 12px;
      font-size: 0.9rem;
    }
    .output {
      margin-top: 16px;
      border: 1px solid #ccc;
      background: #fff;
      padding: 8px;
      min-height: 120px;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem;
    }
    .frame-container {
      margin-top: 16px;
      border: 1px solid #ccc;
      background: #fff;
    }
    iframe {
      width: 100%;
      height: 220px;
      border: none;
      display: block;
    }
    .note {
      font-size: 0.8rem;
      color: #555;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>Visualizador simples de HTML / CSS / JS</h1>

  <div>
    <label><input type="checkbox" id="useHtml" /> HTML</label>
    <label><input type="checkbox" id="useCss" /> CSS</label>
    <label><input type="checkbox" id="useJs" /> JS</label>
  </div>
  <div class="note">
    Se não marcar todos os 3, o conteúdo será tratado como “code inbutido” (incorporado) e ainda será usado.
  </div>

  <textarea id="codeInput" placeholder="Cole seu código aqui (HTML, CSS, JS ou misturado)..."></textarea>
  <br />
  <button id="runBtn">Executar / Visualizar</button>

  <h2 style="font-size:1rem; margin-top:16px;">Saída (texto)</h2>
  <div id="textOutput" class="output"></div>

  <h2 style="font-size:1rem; margin-top:16px;">Saída (renderizada em iframe)</h2>
  <div class="frame-container">
    <iframe id="previewFrame"></iframe>
  </div>

  <script>
    document.getElementById('runBtn').addEventListener('click', () => {
      const useHtml = document.getElementById('useHtml').checked;
      const useCss = document.getElementById('useCss').checked;
      const useJs = document.getElementById('useJs').checked;
      const code = document.getElementById('codeInput').value;

      const textOutput = document.getElementById('textOutput');
      const frame = document.getElementById('previewFrame');

      // Sempre mostra o código como “code inbutido” na saída de texto
      textOutput.textContent = code;

      // Monta o conteúdo do iframe
      let htmlPart = '';
      let cssPart = '';
      let jsPart = '';

      const allSelected = useHtml && useCss && useJs;

      if (allSelected) {
        // Tenta separar por tags se o usuário colou algo parecido com um arquivo completo
        // Esta é uma separação bem simples e ingênua, só para exemplo.
        const htmlMatch = code.match(/<!DOCTYPE[^>]*>|<html[\s\S]*<\/html>/i);
        const styleMatch = code.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
        const scriptMatch = code.match(/<script[^>]*>([\s\S]*?)<\/script>/i);

        if (htmlMatch) {
          htmlPart = htmlMatch[0];
        } else {
          // Se não achar <html>... assume que tudo é HTML
          htmlPart = code;
        }

        if (styleMatch) {
          cssPart = styleMatch[1];
        }
        if (scriptMatch) {
          jsPart = scriptMatch[1];
        }
      } else {
        // Não selecionou todos: trata tudo como “code inbutido”
        // Coloca tudo dentro de <pre> para visualização e também tenta executar como HTML
        htmlPart =
          '<pre style="white-space: pre-wrap; word-break: break-word;">' +
          escapeHtml(code) +
          '</pre>';
        cssPart = '';
        jsPart = '';
      }

      const fullHtml =
        '<!DOCTYPE html>' +
        '<html lang="pt-BR">' +
        '<head>' +
        '<meta charset="UTF-8">' +
        (cssPart ? '<style>' + cssPart + '</style>' : '') +
        '</head>' +
        '<body>' +
        htmlPart +
        (jsPart ? '<script>' + jsPart + '<\/script>' : '') +
        '</body>' +
        '</html>';

      // Escreve no iframe
      const doc = frame.contentDocument || frame.contentWindow.document;
      doc.open();
      doc.write(fullHtml);
      doc.close();
    });

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
